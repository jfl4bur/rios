name: Backend native Node tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  backend-tests:
    name: Run backend native Node tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        node: [24]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}

      - name: Install backend dependencies
        run: npm --prefix backend ci

      - name: Run migrations and seed demo data
        run: |
          echo "--- run migrate (prefer migrate:node with explicit db path) ---"
          npm --prefix backend run migrate:node --silent -- --db backend/data.sqlite || npm --prefix backend run migrate || true
          npm --prefix backend run seed:demo --silent || true

      - name: Start backend in background (for tests that expect http://localhost:9000)
        run: |
          # start backend binding to the explicit port so tests can connect to 127.0.0.1:9000
          npm --prefix backend start &
          # give the server a moment to bind to the port
          sleep 5
        env:
          NODE_ENV: test
          PORT: 9000

      - name: Run backend tests (native Node runner)
        run: |
          npm --prefix backend test
