name: Backend CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Debug environment
        run: |
          echo "--- debug: node/npm versions ---"
          node --version || true
          npm --version || true
          echo "--- debug: ls backend ---"
          ls -la backend || true
          echo "--- debug: backend/package.json ---"
          if [ -f backend/package.json ]; then cat backend/package.json || true; else echo "backend/package.json not found"; fi
          echo "--- debug: run backend tests (verbose) ---"
          npm --prefix backend test --loglevel verbose || true

      - name: Install dependencies (workspaces-aware)
        run: npm ci --workspaces

      - name: Run backend tests
        run: npm --prefix backend test
        env:
          CI: true
