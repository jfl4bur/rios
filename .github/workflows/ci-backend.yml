name: Backend CI

on:
  push:
    branches: [ main, 'feat/**' ]
  pull_request:
    branches: [ main ]

jobs:
  backend-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies (workspaces-aware)
        run: |
          echo "Installing workspace dependencies with retries..."
          retries=3
          attempt=0
          success=0
          while [ $attempt -lt $retries ]; do
            attempt=$((attempt+1))
            echo "npm ci --workspaces (attempt $attempt/$retries)"
            npm ci --workspaces && { success=1; break; } || true
            sleep_seconds=$((2 ** attempt))
            echo "npm ci failed, sleeping $sleep_seconds seconds before retry"
            sleep $sleep_seconds
          done
          if [ $success -ne 1 ]; then
            echo "npm ci failed after $retries attempts — falling back to npm install --workspaces"
            npm install --workspaces
          fi
      

      - name: Debug environment
        run: |
          echo "--- debug: node/npm versions ---"
          node --version || true
          npm --version || true
          echo "--- debug: ls backend ---"
          ls -la backend || true
          echo "--- debug: backend/package.json ---"
          if [ -f backend/package.json ]; then cat backend/package.json || true; else echo "backend/package.json not found"; fi
          echo "--- debug: run backend migrations (explicit db path when available) ---"
          # prefer migrate:node which accepts --db; fall back to migrate
          npm --prefix backend run migrate:node --silent -- --db backend/data.sqlite || npm --prefix backend run migrate || true
          echo "--- debug: seed demo data (if present) ---"
          npm --prefix backend run seed:demo --silent || true
          echo "--- debug: run backend tests (verbose) ---"
          # ensure TEST_BACKEND points to the expected host:port for basic checks
          TEST_BACKEND=http://127.0.0.1:9000 npm --prefix backend test --loglevel verbose || true

      - name: Start backend in background (for tests that expect http://localhost:9000)
        run: |
          # start backend binding to the explicit port so tests can connect to 127.0.0.1:9000
          npm --prefix backend start &
          # give the server a moment to bind to the port
          sleep 5
        env:
          NODE_ENV: test
          PORT: 9000

      - name: Run backend tests
        run: |
          export TEST_BACKEND=http://127.0.0.1:9000
          npm --prefix backend test
        env:
          CI: true
