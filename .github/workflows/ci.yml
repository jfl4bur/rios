name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '18'
      - name: Install dependencies (workspaces-aware)
        run: npm ci --workspaces

      - name: Start backend in background (for tests that expect http://localhost:9000)
        run: |
          npm --prefix backend start &
          sleep 2
        env:
          NODE_ENV: test

      - name: Run backend tests
        run: |
          export TEST_BACKEND=http://127.0.0.1:9000
          npm --prefix backend test
